<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harshal ❤️ Princess</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#ff5f9e,#ffd1e8);
overflow:hidden;
color:white;
text-align:center;
}

#loading{
position:fixed;
width:100%;
height:100%;
background:#ff5f9e;
display:flex;
justify-content:center;
align-items:center;
font-size:45px;
font-family:'Great Vibes',cursive;
z-index:9999;
}

#main{
display:none;
padding:20px;
}

h1{
font-size:50px;
font-family:'Great Vibes',cursive;
margin-top:20px;
}

button{
padding:15px 40px;
border:none;
border-radius:50px;
font-size:20px;
background:white;
color:#ff2f78;
margin-top:30px;
cursor:pointer;
}

#letter{
display:none;
margin-top:30px;
background:rgba(255,255,255,.15);
padding:25px;
border-radius:20px;
backdrop-filter:blur(10px);
line-height:2;
font-size:18px;
}

</style>

</head>

<body>

<div id="loading">

Harshal ❤️ Princess

</div>

<div id="main">

<h1>Welcome My Princess ❤️</h1>

<p>22 August 2024 Forever ♾️</p>

<button onclick="openLetter()">

💌 Open My Letter

</button>

<div id="letter">

<h2>Dear Princess ❤️</h2>

<p id="typing"></p>

</div>

</div>

<script>

setTimeout(()=>{

loading.style.display="none";

main.style.display="block";

},3000);

const text=`22/08/2024 meri zindagi ka sabse khoobsurat din tha.

Kyuki us din aap meri zindagi ka hissa bane.

Aapki smile meri duniya hai.

Main hamesha aapka saath dunga.

I Love You So Much Princess ❤️

Forever Yours,
Harshal`;

let i=0;

function openLetter(){

document.getElementById("letter").style.display="block";

type();

}

function type(){

if(i<text.length){

document.getElementById("typing").innerHTML+=text.charAt(i);

i++;

setTimeout(type,35);

}

}
<style>

.gallery{
display:flex;
overflow-x:auto;
gap:15px;
padding:20px;
margin-top:30px;
}

.gallery img{
width:220px;
height:300px;
object-fit:cover;
border-radius:20px;
box-shadow:0 0 20px rgba(255,255,255,.5);
transition:.4s;
}

.gallery img:hover{
transform:scale(1.08);
}

.heart{
position:fixed;
top:-30px;
font-size:25px;
animation:fall linear forwards;
}

@keyframes fall{

to{

transform:translateY(110vh);

}

}

</style>

<h2 style="margin-top:40px;">📸 Our Beautiful Memories ❤️</h2>

<div class="gallery">

<img src="photos/1.jpg">
<img src="photos/2.jpg">
<img src="photos/3.jpg">
<img src="photos/4.jpg">
<img src="photos/5.jpg">
<img src="photos/6.jpg">
<img src="photos/7.jpg">
<img src="photos/8.jpg">

</div>

<script>

function createHeart(){

const h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(3+Math.random()*4)+"s";

document.body.appendChild(h);

setTimeout(()=>h.remove(),7000);

}

setInterval(createHeart,250);// ❤️ Anniversary Timer
const startDate = new Date("2024-08-22T00:00:00");

const timer = document.createElement("h2");
timer.style.marginTop = "30px";
timer.style.fontSize = "28px";
timer.style.color = "#fff";
document.getElementById("main").appendChild(timer);

function updateTimer() {
    const now = new Date();
    const diff = now - startDate;

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    timer.innerHTML =
        `❤️ Together for ${days} Days ${hours} Hours ${minutes} Minutes ${seconds} Seconds ❤️`;
}

updateTimer();
setInterval(updateTimer, 1000);

</script>
</script>

</body>
</html>
